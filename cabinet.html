<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сайт</title>
<link rel="icon" href="/icon.jpg">
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="cabinet">
<div id="header"></div>
<main class="wrap">
  <div id="cab-need-auth" class="card" style="display:none">
    <p>Кабинет доступен только после входа. Нажмите «Вход» в шапке сайта.</p>
  </div>
  <div id="cab-area" style="display:none">
    <div class="card form-narrow">
      <h2>Кабинет</h2>
      <p class="muted" id="ip-note"></p>
      <form id="cab-form">
        <label>ФИО</label><input id="cab-fn">
        <label>Дата рождения</label><input id="cab-birth" type="date">
        <label>Воинская часть</label><input id="cab-unit">
        <label>Телефон</label><input id="cab-phone">
        <p><button type="submit">Сохранить</button></p>
      </form>
    </div>
  </div>
</main>
<script src="/app.js"></script>
<script src="/page.js"></script>

</body>
</html>
